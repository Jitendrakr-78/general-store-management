<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Sales Management
    </title>

    <link
        rel="stylesheet"
        href="../css/sales.css">

</head>


<body>


<div class="page-container">


    <!-- HEADER -->

    <header class="page-header">

        <div>

            <h1>
                Sales Management
            </h1>

            <p>
                Create and manage sales invoices
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back-button">

            ← Dashboard

        </a>

    </header>



    <!-- SALES FORM -->

    <section class="sale-card">

        <h2>
            New Sale
        </h2>


        <div class="top-form">


            <!-- CUSTOMER -->

            <div class="form-group">

                <label>
                    Customer
                </label>

                <select
                    id="customerSelect">

                    <option value="">
                        Walk-in Customer
                    </option>

                </select>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>
                    Sale Date *
                </label>

                <input
                    type="date"
                    id="saleDate">

            </div>


        </div>


        <!-- ITEMS -->

        <div class="items-header">

            <h3>
                Sale Items
            </h3>

            <button
                type="button"
                class="add-button"
                onclick="addSaleRow()">

                + Add Product

            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Product
                        </th>

                        <th>
                            Available
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Selling Price
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="saleItemsBody">

                </tbody>

            </table>

        </div>


        <!-- TOTALS -->

        <div class="totals-container">


            <div class="total-row">

                <span>
                    Subtotal:
                </span>

                <strong
                    id="subtotal">

                    Rs. 0.00

                </strong>

            </div>


            <div class="discount-row">

                <label>
                    Discount:
                </label>

                <input
                    type="number"
                    id="discount"
                    value="0"
                    min="0"
                    step="0.01">

            </div>


            <div class="total-row">

                <span>
                    Grand Total:
                </span>

                <strong
                    id="grandTotal">

                    Rs. 0.00

                </strong>

            </div>


            <div class="discount-row">

                <label>
                    Paid Amount:
                </label>

                <input
                    type="number"
                    id="paidAmount"
                    value="0"
                    min="0"
                    step="0.01">

            </div>


            <div class="total-row due-row">

                <span>
                    Due Amount:
                </span>

                <strong
                    id="dueAmount">

                    Rs. 0.00

                </strong>

            </div>


            <div class="discount-row">

                <label>
                    Payment Method:
                </label>

                <select
                    id="paymentMethod">

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Card">
                        Card
                    </option>

                    <option value="Bank">
                        Bank
                    </option>

                    <option value="eSewa">
                        eSewa
                    </option>

                    <option value="Khalti">
                        Khalti
                    </option>

                </select>

            </div>


        </div>


        <!-- SAVE -->

        <div class="save-container">

            <button
                class="save-sale-button"
                onclick="saveSale()">

                Save Sale

            </button>

        </div>

    </section>



    <!-- SALES HISTORY -->

    <section class="sale-list-card">

        <div class="list-header">

            <div>

                <h2>
                    Sales History
                </h2>

                <p>
                    Previous sales invoices
                </p>

            </div>


            <input
                type="text"
                id="searchSale"
                placeholder="Search invoice or customer">

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Invoice
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Grand Total
                        </th>

                        <th>
                            Paid
                        </th>

                        <th>
                            Due
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="saleListBody">

                </tbody>

            </table>

        </div>

    </section>


</div>


<script
    src="../js/sales.js">
</script>


</body>

</html>
