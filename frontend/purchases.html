<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Purchase Management
    </title>

    <link
        rel="stylesheet"
        href="../css/purchases.css">

</head>


<body>


<div class="page-container">


    <!-- HEADER -->

    <header class="page-header">

        <div>

            <h1>
                Purchase Management
            </h1>

            <p>
                Create and manage purchase invoices
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back-button">

            ← Dashboard

        </a>

    </header>



    <!-- PURCHASE FORM -->

    <section class="purchase-card">

        <h2>
            New Purchase
        </h2>


        <div class="top-form">


            <!-- Supplier -->

            <div class="form-group">

                <label>
                    Supplier *
                </label>

                <select
                    id="supplierSelect">

                    <option value="">
                        Select Supplier
                    </option>

                </select>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label>
                    Purchase Date *
                </label>

                <input
                    type="date"
                    id="purchaseDate">

            </div>


        </div>


        <!-- ITEMS -->

        <div class="items-header">

            <h3>
                Purchase Items
            </h3>

            <button
                type="button"
                class="add-button"
                onclick="addPurchaseRow()">

                + Add Product

            </button>

        </div>


        <div class="table-wrapper">

            <table id="purchaseTable">

                <thead>

                    <tr>

                        <th>
                            Product
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Purchase Price
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="purchaseItemsBody">

                </tbody>

            </table>

        </div>


        <!-- TOTALS -->

        <div class="totals-container">


            <div class="total-row">

                <span>
                    Subtotal:
                </span>

                <strong id="subtotal">
                    Rs. 0.00
                </strong>

            </div>


            <div class="discount-row">

                <label>
                    Discount:
                </label>

                <input
                    type="number"
                    id="discount"
                    value="0"
                    min="0"
                    step="0.01">


            </div>


            <div class="total-row grand-total">

                <span>
                    Grand Total:
                </span>

                <strong id="grandTotal">
                    Rs. 0.00
                </strong>

            </div>


        </div>


        <!-- SAVE -->

        <div class="save-container">

            <button
                class="save-purchase-button"
                onclick="savePurchase()">

                Save Purchase

            </button>

        </div>


    </section>



    <!-- PURCHASE LIST -->

    <section class="purchase-list-card">

        <div class="list-header">

            <div>

                <h2>
                    Purchase History
                </h2>

                <p>
                    Previous purchase invoices
                </p>

            </div>


            <input
                type="text"
                id="searchPurchase"
                placeholder="Search invoice or supplier">

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Invoice
                        </th>

                        <th>
                            Supplier
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Subtotal
                        </th>

                        <th>
                            Discount
                        </th>

                        <th>
                            Grand Total
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="purchaseListBody">

                </tbody>

            </table>

        </div>

    </section>


</div>


<script
    src="../js/purchases.js">
</script>


</body>

</html>
