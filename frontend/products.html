<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Products - General Store</title>

    <link
        rel="stylesheet"
        href="../css/products.css">

</head>


<body>


<div class="page-container">


    <!-- Header -->

    <header class="page-header">

        <div>

            <h1>Product Management</h1>

            <p>
                Manage your store products
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back-button">

            ← Dashboard

        </a>

    </header>



    <!-- Product Form -->

    <section class="product-form-card">

        <h2 id="formTitle">
            Add New Product
        </h2>


        <form id="productForm">


            <input
                type="hidden"
                id="productId">


            <div class="form-grid">


                <!-- Product Name -->

                <div class="form-group">

                    <label>
                        Product Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter product name"
                        required>

                </div>


                <!-- SKU -->

                <div class="form-group">

                    <label>
                        SKU *
                    </label>

                    <input
                        type="text"
                        id="sku"
                        placeholder="Enter SKU"
                        required>

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="category_id">

                        <option value="">
                            Select Category
                        </option>

                    </select>


                </div>


                <!-- Unit -->

                <div class="form-group">

                    <label>
                        Unit
                    </label>

                    <select id="unit">

                        <option value="piece">
                            Piece
                        </option>

                        <option value="kg">
                            Kg
                        </option>

                        <option value="gram">
                            Gram
                        </option>

                        <option value="litre">
                            Litre
                        </option>

                        <option value="packet">
                            Packet
                        </option>

                        <option value="box">
                            Box
                        </option>

                        <option value="bag">
                            Bag
                        </option>

                    </select>

                </div>


                <!-- Purchase Price -->

                <div class="form-group">

                    <label>
                        Purchase Price
                    </label>

                    <input
                        type="number"
                        id="purchase_price"
                        min="0"
                        step="0.01"
                        placeholder="0.00">

                </div>


                <!-- Selling Price -->

                <div class="form-group">

                    <label>
                        Selling Price
                    </label>

                    <input
                        type="number"
                        id="selling_price"
                        min="0"
                        step="0.01"
                        placeholder="0.00">

                </div>


                <!-- Stock -->

                <div class="form-group">

                    <label>
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="stock_quantity"
                        min="0"
                        placeholder="0">

                </div>


                <!-- Minimum Stock -->

                <div class="form-group">

                    <label>
                        Minimum Stock
                    </label>

                    <input
                        type="number"
                        id="minimum_stock"
                        min="0"
                        value="5">

                </div>


            </div>


            <!-- Buttons -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-button"
                    id="saveButton">

                    Save Product

                </button>


                <button
                    type="button"
                    class="cancel-button"
                    onclick="resetForm()">

                    Clear

                </button>

            </div>


        </form>

    </section>



    <!-- Product List -->

    <section class="product-list-card">


        <div class="list-header">

            <div>

                <h2>Product List</h2>

                <p>
                    All products available in store
                </p>

            </div>


            <input
                type="text"
                id="searchInput"
                placeholder="Search product...">

        </div>



        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Product</th>

                        <th>SKU</th>

                        <th>Category</th>

                        <th>Purchase</th>

                        <th>Selling</th>

                        <th>Stock</th>

                        <th>Unit</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="productTableBody">

                    <tr>

                        <td colspan="9">

                            Loading products...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </section>


</div>



<script src="../js/products.js"></script>

</body>

</html>
