<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Supplier Management
    </title>

    <link
        rel="stylesheet"
        href="../css/suppliers.css">

</head>


<body>


<div class="page-container">


    <!-- Header -->

    <header class="page-header">

        <div>

            <h1>
                Supplier Management
            </h1>

            <p>
                Manage store suppliers
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back-button">

            ← Dashboard

        </a>

    </header>



    <!-- Supplier Form -->

    <section class="supplier-form-card">

        <h2 id="formTitle">
            Add New Supplier
        </h2>


        <form id="supplierForm">


            <input
                type="hidden"
                id="supplierId">


            <div class="form-grid">


                <!-- Supplier Name -->

                <div class="form-group">

                    <label>
                        Supplier Name *
                    </label>

                    <input
                        type="text"
                        id="supplierName"
                        placeholder="Enter supplier name"
                        required>

                </div>


                <!-- Company -->

                <div class="form-group">

                    <label>
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        placeholder="Enter company name">

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number">

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email">

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter address">

                </div>


                <!-- City -->

                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city">

                </div>


            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-button"
                    id="saveButton">

                    Save Supplier

                </button>


                <button
                    type="button"
                    class="cancel-button"
                    onclick="resetSupplierForm()">

                    Clear

                </button>

            </div>


        </form>

    </section>



    <!-- Supplier List -->

    <section class="supplier-list-card">


        <div class="list-header">

            <div>

                <h2>
                    Supplier List
                </h2>

                <p>
                    All registered suppliers
                </p>

            </div>


            <input
                type="text"
                id="searchInput"
                placeholder="Search supplier...">

        </div>



        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Supplier</th>

                        <th>Company</th>

                        <th>Phone</th>

                        <th>Email</th>

                        <th>City</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody
                    id="supplierTableBody">

                    <tr>

                        <td colspan="7">

                            Loading suppliers...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </section>


</div>


<script
    src="../js/suppliers.js">
</script>


</body>

</html>
